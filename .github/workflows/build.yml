name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # This fork is only used on Windows, so only Windows is built and released.
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build Release
        run: cargo build --release

      - name: Set Version Info
        shell: bash
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          echo "RELEASE_VERSION=$(date +'%Y.%m.%d')-${FULL_SHA::7}" >> $GITHUB_ENV
          echo "CURRENT_DATE_STR=$(date)" >> $GITHUB_ENV
          cp target/release/psst-gui.exe Psst.exe

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: Psst.exe
          path: Psst.exe

      - name: Create Rolling Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Continuous release (${{ env.RELEASE_VERSION }})
          tag_name: rolling
          make_latest: true
          prerelease: false
          body: |
            This is a rolling release of Psst, published automatically on every commit to main.

            Version: ${{ env.RELEASE_VERSION }}
            Commit: ${{ github.sha }}
            Built: ${{ env.CURRENT_DATE_STR }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: Psst.exe
          generate_release_notes: false
